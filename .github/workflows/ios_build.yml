Set-Content -Path "C:\youweiler\.github\workflows\ios_build.yml" -Value 'name: Compilar iOS IPA

on:
push:
branches: [ "main", "master" ]

jobs:
build-ios:
runs-on: macos-latest
steps:
  - name: 1. Clonar repositorio
    uses: actions/checkout@v4

  - name: 2. Configurar Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: 3. Configurar Java (requerido por Flutter/Flet)
    uses: actions/setup-java@v4
    with:
      distribution: "temurin"
      java-version: "17"

  - name: 4. Instalar Flutter SDK
    uses: subosito/flutter-action@v2
    with:
      flutter-version: "3.24.x"
      channel: "stable"
      cache: true

  - name: 5. Instalar Flet CLI y dependencias
    run: |
      pip install --upgrade pip
      pip install flet qrcode Pillow

  - name: 6. Compilar paquete IPA para iOS (Modo Debug sin firma local estricta)
    run: |
      flet build ipa --verbose

  - name: 7. Subir archivo IPA como artefacto descargable
    uses: actions/upload-artifact@v4
    with:
      name: youweiler-ios-ipa
      path: build/ios/ipa/*.ipa
' -Encoding UTF8